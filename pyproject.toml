[project]
name = "simple-project"
version = "0.1.0"
description = "Local FLUX.2 klein 4B generation and editing"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.6.0",
    "diffusers",
    "huggingface-hub>=0.30.0",
    "pillow>=10.4.0",
    "protobuf>=5.29.0",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.0",
    "torch",
    "torchvision",
    "transformers>=4.51.0",
]

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers.git" }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
